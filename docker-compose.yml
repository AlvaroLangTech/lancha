services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lancha-beju-backend
    restart: always
    ports:
      - "3101:3101"
    env_file:
      - ./server/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3101/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"
